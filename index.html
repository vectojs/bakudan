<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches the theme surface base (BAKUDAN_THEME.surface rgb(7,9,13)) so the
         pre-video frame, the browser chrome, and the floating panels read as one
         depth stack instead of three different near-blacks. -->
    <meta name="theme-color" content="#07090d" />
    <title>Bakudan — Danmaku Playground</title>
    <meta
      name="description"
      content="Canvas-native danmaku playground — 5,000 concurrent barrage entities at 60fps on VectoJS."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bakudan" />
    <meta property="og:title" content="Bakudan — Danmaku Playground" />
    <meta
      property="og:description"
      content="Canvas-native danmaku playground — 5,000 concurrent barrage entities at 60fps on VectoJS."
    />
    <meta property="og:url" content="https://bakudan.vectojs.org/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Bakudan — Danmaku Playground" />
    <meta
      name="twitter:description"
      content="Canvas-native danmaku playground — 5,000 concurrent barrage entities at 60fps on VectoJS."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Same base as BAKUDAN_THEME.surface; #0f1420 here used to flash a
           visibly different near-black behind the panels before video load. */
        --bg-color: #07090d;
        --text-color: #e2e8f0;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
      }
    </style>
    <link rel="stylesheet" href="/src/styles/shell.css" />
  </head>
  <body class="hybrid">
    <header id="bakudan-header" aria-label="Bakudan status"></header>
    <div id="stage-container">
      <div id="bakudan-bg"></div>
      <canvas id="bakudan-canvas"></canvas>
    </div>
    <footer id="command-deck" aria-label="Playback controls"></footer>
    <aside id="lab-drawer" aria-label="Laboratory drawer"></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
