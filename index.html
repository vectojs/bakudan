<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches the theme surface base (BAKUDAN_THEME.surface rgb(7,9,13)) so the
         pre-video frame, the browser chrome, and the floating panels read as one
         depth stack instead of three different near-blacks. -->
    <meta name="theme-color" content="#07090d" />
    <title>Bakudan — Danmaku Playground</title>
    <meta
      name="description"
      content="Canvas-native danmaku playground — 5,000 concurrent barrage entities at 60fps on VectoJS."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bakudan" />
    <meta property="og:title" content="Bakudan — Danmaku Playground" />
    <meta
      property="og:description"
      content="Canvas-native danmaku playground — 5,000 concurrent barrage entities at 60fps on VectoJS."
    />
    <meta property="og:url" content="https://bakudan.vectojs.org/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Bakudan — Danmaku Playground" />
    <meta
      name="twitter:description"
      content="Canvas-native danmaku playground — 5,000 concurrent barrage entities at 60fps on VectoJS."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Same base as BAKUDAN_THEME.surface; #0f1420 here used to flash a
           visibly different near-black behind the panels before video load. */
        --bg-color: #07090d;
        --text-color: #e2e8f0;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          sans-serif;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        position: absolute;
        top: 0;
        left: 0;
      }
      /* Layer stack (bottom → top):
         - #bakudan-bg (z0): ambient gradient / <video> background
         - Scene's stacked WebGL canvas (z1, set in main.ts): plain danmaku glyphs
         - #bakudan-canvas (z2): Canvas2D special-pass danmaku + HUD/panel UI
         The danmaku must sit ABOVE the background but BELOW the UI, which is why
         the background can't share the 2D canvas — it moves to its own DOM layer. */
      #bakudan-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 0;
        overflow: hidden;
      }
      /* Dark-coherent with the theme (the old cream/peach gradient belonged to
          a light "glassmorphic peach" era and clashed with every panel). Static
          radial gradient on purpose - no keyframes, so render-on-demand keeps
          holding at idle (see App.hasAmbientAnimation). Unreachable while App
          pins bg.mode='video', kept correct for when ambient mode returns. */
      #bakudan-bg.ambient {
        background:
          radial-gradient(circle at 50% 30%, rgba(96, 165, 250, 0.10) 0%, rgba(96, 165, 250, 0.04) 32%, rgba(7, 9, 13, 0) 62%),
          radial-gradient(circle at 82% 78%, rgba(244, 63, 94, 0.07) 0%, rgba(7, 9, 13, 0) 55%),
          linear-gradient(180deg, #0b101b 0%, #07090d 100%);
      }
      #bakudan-bg > video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(0.72) saturate(0.92);
      }
      #bakudan-canvas {
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div id="bakudan-bg" class="ambient"></div>
    <canvas id="bakudan-canvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
